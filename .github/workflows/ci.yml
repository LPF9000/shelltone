name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.shell }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, zsh]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify prompt resources
        run: |
          test -x bin/shelltone
          test -x bin/shelltone-configure
          test -x bin/shelltone-install
          test -r layouts/frame.sh
          test -r layouts/pure.sh
          test -r layouts/zen.sh
          test -r layouts/blocks.sh
          git diff --check origin/main...HEAD
      - name: Install Zsh
        if: matrix.shell == 'zsh'
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: Run checks
        run: ./tests/check.${{ matrix.shell }}
      - name: Check prompt lifecycles
        if: matrix.shell == 'zsh'
        run: python3 tests/test-runtime.py -v
